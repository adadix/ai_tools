domain_priority:
  p-core: 3
  core: 3
  imc: 3
  uncore: 3
  cha: 3
  memory: 3
  hbm: 3
  e-core: 2
  atom: 2
  cbo: 2
  ncu: 2
  hac_cbo: 2
  hac_ncu: 2
  m2m: 2
  upi: 2
  qpi: 2
  mesh: 2
  m3upi: 2
  lpe-core: 2
  llc: 2
  system: 1
  power: 1
  ufibridge: 1
  iio: 1
  pcie: 1
  offcore: 1
  custom_cache: 2
  ddr5-mc: 3
  new_fabric: 2
  pcie_gen5: 1
  xyz-core: 3
  LD_LIBRARY_PATH=: 2
domain_categories:
  cpu_cores:
    description: Processor execution cores
    domains:
    - p-core
    - e-core
    - core
    - atom
    - lpe-core
    - xyz-core
    patterns:
    - core
    - atom
    stress_recommended:
    - prime95
    - linpack
    - y-cruncher
    - cpuburn
    - stress-ng
  memory_subsystem:
    description: Memory controllers and DRAM interface
    domains:
    - imc
    - hbm
    - m2m
    - memory
    - ddr5-mc
    patterns:
    - imc
    - mc
    - memory
    - m2m
    - hbm
    - ddr
    stress_recommended:
    - memtester
    - stream
    - mlc
    - memicals
    - membw
  cache_coherency:
    description: Cache and coherency management units
    domains:
    - cbo
    - cha
    - hac_cbo
    - llc
    - custom_cache
    patterns:
    - cbo
    - cha
    - llc
    - cache
    stress_recommended:
    - stream
    - memtester
    - mlc
  interconnect:
    description: Inter-core and inter-die communication
    domains:
    - ncu
    - hac_ncu
    - upi
    - qpi
    - mesh
    - m3upi
    - new_fabric
    patterns:
    - ncu
    - upi
    - m3upi
    - mesh
    - qpi
    stress_recommended:
    - stress-ng
    - stream
  io_subsystem:
    description: I/O and peripheral interfaces
    domains:
    - ufibridge
    - iio
    - pcie
    - pcie_gen5
    patterns:
    - iio
    - pcie
    - ufi
    - bridge
    stress_recommended:
    - fio
    - iozone
  power_management:
    description: Power and frequency management
    domains:
    - power
    patterns:
    - power
    - energy
    - freq
    stress_recommended:
    - idle
    - powertop
  uncore_general:
    description: General uncore resources
    domains:
    - uncore
    - offcore
    - LD_LIBRARY_PATH=
    patterns:
    - uncore
    - offcore
    stress_recommended:
    - stress-ng
    - sysbench
critical_domains:
- p-core
- e-core
- imc
- memory
- cbo
- cha
- ddr5-mc
- xyz-core
ml_domain_lists:
