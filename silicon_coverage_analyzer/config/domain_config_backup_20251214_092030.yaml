  anomaly_detector:
  - p-core
  - e-core
  - imc
  - cbo
  - hac_cbo
  - ncu
  - hac_ncu
  - ufibridge
  - power
  - custom_cache
  - ddr5-mc
  - new_fabric
  - xyz-core
