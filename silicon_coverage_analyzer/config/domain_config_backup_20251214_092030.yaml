  m2m: '#16a085'
  cbo: '#8e44ad'
  cha: '#e91e63'
  hac_cbo: '#c0392b'
  llc: '#9b59b6'
  ncu: '#16a085'
  hac_ncu: '#d35400'
  upi: '#34495e'
  qpi: '#2c3e50'
  mesh: '#7f8c8d'
  m3upi: '#5d4037'
  ufibridge: '#2c3e50'
  iio: '#3f51b5'
  pcie: '#607d8b'
  power: '#e74c3c'
  system: '#95a5a6'
  custom_cache: '#00bcd4'
  ddr5-mc: '#27ae60'
  new_fabric: '#9c27b0'
  pcie_gen5: '#ff5722'
  xyz-core: '#4caf50'
