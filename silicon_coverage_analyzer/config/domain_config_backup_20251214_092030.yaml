  - imc
  - memory
  - ddr5-mc
  - xyz-core
uncore_domains:
- cbo
- ncu
- hac_cbo
- hac_ncu
- cha
- imc
- upi
- qpi
- m2m
- m3upi
- custom_cache
- ddr5-mc
- new_fabric
- LD_LIBRARY_PATH=
stress_tool_domains:
  prime95:
    domains:
    - p-core
    - e-core
    categories:
    - cpu_cores
    type: compute
    intensity: high
  stress-ng:
    domains:
    - p-core
    - e-core
    - uncore
    categories:
    - cpu_cores
    - uncore_general
    type: mixed
    intensity: high
  memtester:
    domains:
    - uncore
    - memory
    - imc
    categories:
    - memory_subsystem
    type: memory
    intensity: high
  linpack:
    domains:
    - p-core
    categories:
    - cpu_cores
    type: compute
    intensity: extreme
  y-cruncher:
    domains:
    - p-core
    - e-core
    categories:
    - cpu_cores
    type: compute
    intensity: extreme
  cpuburn:
    domains:
    - p-core
    - e-core
    categories:
    - cpu_cores
    type: compute
    intensity: extreme
  stream:
    domains:
    - uncore
    - memory
    - imc
    categories:
    - memory_subsystem
    - cache_coherency
    type: memory
    intensity: medium
  sysbench:
    domains:
    - p-core
    - e-core
    - uncore
    categories:
    - cpu_cores
    - uncore_general
    type: mixed
    intensity: medium
  geekbench:
    domains:
    - p-core
    - e-core
    categories:
    - cpu_cores
    type: mixed
    intensity: medium
  cinebench:
    domains:
    - p-core
    - e-core
    categories:
    - cpu_cores
    type: compute
    intensity: high
  mlc:
    domains:
    - imc
    - cbo
    - cha
    categories:
    - memory_subsystem
    - cache_coherency
    type: memory
    intensity: high
  memicals:
    domains:
    - imc
    - memory
    categories:
    - memory_subsystem
    type: memory
    intensity: high
  sandstone:
    domains:
    - p-core
    - e-core
    - imc
    categories:
    - cpu_cores
    - memory_subsystem
    type: mixed
    intensity: high
  idle:
    domains:
    - system
    categories:
    - power_management
    type: baseline
    intensity: low
  unknown:
    domains:
    - p-core
    categories:
    - cpu_cores
    type: mixed
    intensity: medium
recommendations:
  cpu_cores_idle:
    condition: p-core or e-core domains show low stress
    message: Consider CPU-intensive workload (prime95, linpack, stress-ng) to stress
      core domains
  memory_idle:
    condition: imc, cbo, or uncore domains show low stress
    message: Consider memory-intensive workload (memtester, stream, mlc) to stress
      uncore/cache/memory domains
  memory_anomaly:
    condition: imc or cbo domains show high stress but low activity
    message: Memory stress test not showing expected IMC/cache activity - check workload
      configuration
  uncore_coverage:
    condition: Memory workload detected
    message: Good memory-intensive workload detected. Uncore domain events should
      be well-covered.
  cache_egress:
    condition: CHA/CBO egress events not toggling
    message: Consider adding memory stress to activate CHA/IMC egress events
